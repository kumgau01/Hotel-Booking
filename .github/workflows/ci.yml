
name: Hotel Booking CI

# When should this pipeline run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Build and test the application
      - name: Build with Maven
        run: mvn -f hotel_booking/mvp_hotel_booking/mvp_hotel_booking/pom.xml clean verify
