
name: Hotel Booking CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: hotel_booking
          MYSQL_USER: hoteluser
          MYSQL_PASSWORD: hotelpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -f hotel_booking/mvp_hotel_booking/mvp_hotel_booking/pom.xml clean verify
        env:
          SPRING_DATASOURCE_PASSWORD: hotelpass

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./hotel_booking/mvp_hotel_booking/mvp_hotel_booking
          push: true
          tags: |
            grts2606/hotel-booking:latest
            grts2606/hotel-booking:${{ github.sha }}

  deploy:
    name: Deploy to Local Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Capture previous image
        id: previous
        shell: powershell
        run: |
          $previousImage = docker inspect --format '{{.Config.Image}}' hotel-booking-app

          if ($LASTEXITCODE -ne 0) {
              throw "Could not identify the currently running application image."
          }

          $prefix = "grts2606/hotel-booking:"
          if (-not $previousImage.StartsWith($prefix)) {
              throw "Unexpected previous image: $previousImage"
          }

          $previousTag = $previousImage.Substring($prefix.Length)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$previousTag"

          Write-Host "Previous image tag: $previousTag"

      - name: Deploy and verify new application
        id: deployment
        continue-on-error: true
        working-directory: hotel_booking/mvp_hotel_booking/mvp_hotel_booking
        env:
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          docker compose pull app
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to pull the new Docker image."
          }

          docker compose up -d --no-deps app
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start the new application."
          }

          $url = "http://localhost:8080/api/v1/hotels"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "New application is healthy."
                      exit 0
                  }
              }
              catch {
                  Write-Host "Health check attempt $attempt failed."
              }

              Start-Sleep -Seconds 10
          }

          throw "New application health check failed."

      - name: Rollback to previous application
        if: steps.deployment.outcome == 'failure'
        working-directory: hotel_booking/mvp_hotel_booking/mvp_hotel_booking
        env:
          IMAGE_TAG: ${{ steps.previous.outputs.tag }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Rolling back to image tag: $env:IMAGE_TAG"

          docker pull "grts2606/hotel-booking:$env:IMAGE_TAG"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not pull the previous image."
          }

          docker compose up -d --no-deps app
          if ($LASTEXITCODE -ne 0) {
              throw "Could not restore the previous application."
          }

          $url = "http://localhost:8080/api/v1/hotels"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
              try {
                  $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      Write-Host "Rollback successful. Previous application is healthy."
                      exit 0
                  }
              }
              catch {
                  Write-Host "Rollback health check attempt $attempt failed."
              }

              Start-Sleep -Seconds 10
          }

          throw "Rollback attempted, but previous application is not healthy."

      - name: Mark deployment as failed
        if: always() && steps.deployment.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "New deployment failed. Rollback was attempted."
          exit 1
