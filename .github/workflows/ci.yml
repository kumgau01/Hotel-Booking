
name: Hotel Booking CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: hotel_booking
          MYSQL_USER: hoteluser
          MYSQL_PASSWORD: hotelpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -f hotel_booking/mvp_hotel_booking/mvp_hotel_booking/pom.xml clean verify
        env:
          SPRING_DATASOURCE_PASSWORD: hotelpass

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./hotel_booking/mvp_hotel_booking/mvp_hotel_booking
          push: true
          tags: |
            grts2606/hotel-booking:latest
            grts2606/hotel-booking:${{ github.sha }}
  deploy:
    name: Deploy to Local Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull Docker image
        working-directory: hotel_booking/mvp_hotel_booking/mvp_hotel_booking
        env:
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: docker compose pull app

      - name: Deploy application
        working-directory: hotel_booking/mvp_hotel_booking/mvp_hotel_booking
        env:
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: docker compose up -d --no-deps app
