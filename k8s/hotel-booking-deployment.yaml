
apiVersion: apps/v1
kind: Deployment

metadata:
  name: hotel-booking
  namespace: hotel-booking

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hotel-booking

  template:
    metadata:
      labels:
        app: hotel-booking

    spec:
      containers:
        - name: hotel-booking
          image: grts2606/hotel-booking:latest

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: hotel-booking-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: hotel-booking-config
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hotel-db-secret
                  key: SPRING_DATASOURCE_PASSWORD


          livenessProbe:
            httpGet:
              path: /gaurav
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /gaurav
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
